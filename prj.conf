#
# nRF54LM20A 极客版 综合硬件测试工程配置文件
#

# GPIO 驱动支持
CONFIG_GPIO=y

# 串口与控制台配置 (115200 8N1，支持终端双向通信)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# 外挂 SPI Flash 支持 (W25Q128JVSIQ, 16 MiB / 128 Mbit)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# 配置 SPI NOR 扇区大小为 4096 字节 (4 KiB)
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# 堆栈与工作队列支持 (扩大主线程堆栈，保证速度基准跑分与 Hex Dump 裕量)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
